pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdk = properties.getProperty("flutter.sdk")
        assert flutterSdk != null : "flutter.sdk not set in local.properties"
        return flutterSdk
    }()

    settings.ext.flutterSdkPath = flutterSdkPath

    // Let Gradle find plugins (AGP, Kotlin, etc.)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Tell Gradle where the Flutter Gradle plugins live
    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
}

// Gradle plugins (new style)
plugins {
    // Flutter Gradle plugin (applied from app/build.gradle)
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false

    // Flutter plugin loader (needed for Flutter plugins)
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false

    // Android Gradle Plugin – bump to a recent compatible version
    // (adjust if your Flutter version documentation suggests a specific one)
    id "com.android.application" version "8.3.0" apply false

    // Kotlin plugin – must be >= the version required by your plugins
    // package_info_plus 9.x uses Kotlin 2.2.x, so match it or higher 2.2.x line.
    id "org.jetbrains.kotlin.android" version "2.2.0" apply false
}

// Your app module
include(":app")
